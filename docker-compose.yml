version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexusre-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexusre
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nexusre-network

  redis:
    image: redis:7-alpine
    container_name: nexusre-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexusre-network

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: nexusre-backend
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    networks:
      - nexusre-network

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: nexusre-frontend
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - nexusre-network

volumes:
  postgres_data:
  redis_data:

networks:
  nexusre-network:
    driver: bridge
